id = "F12"
kind = "feature"
level = 1
origin = "upstream-fix"
suites = ["userloop"]
# Underspecified feature with a user in the loop (docs/task-catalog.md, tenth search U3). Upstream:
# twisted/towncrier issue #464 "Wrap output changelog at specified line width"; PR #740 (squash-merged
# 2026-08-15 as ce469dd, after the model cutoff). The prompt asks for a configurable width without naming
# the setting; user.md holds the decisive design: `wrap` itself accepts an integer (the maintainer asked for
# one option, not a second one), `true` stays 79, and an integer <= 0 falls back to 79 rather than turning
# wrapping off. Caveat: a 2024 issue comment already suggested "accept an integer", so the one-option design
# may be recalled; the <= 0 rule is post-cutoff.
timeout_s = 1200
budget_usd = 3.0
max_turns = 40
install = "uv pip install --python /opt/venv/bin/python -e . twisted"
# test_format.py is the fix's version (render_fragments with wrap=119 and wrap=0).
# test_hai_proof_wrap.py is hand-written: the same rules end to end through `towncrier build --draft` with
# `wrap` set in pyproject.toml. It is not part of the fix, so re-copy it after `build-task --force`.
acceptance = ["src/towncrier/test/test_format.py", "src/towncrier/test/test_hai_proof_wrap.py"]
# towncrier's own runner (noxfile `tests`: twisted.trial over the package) for both steps.
acceptance_cmd = "python -m twisted.trial towncrier.test.test_format towncrier.test.test_hai_proof_wrap"
regression = "python -m twisted.trial towncrier"

[source]
