id = "F51"
kind = "feature"
level = 2
origin = "upstream-fix"
# F28 under the strict + full reticent stand-in (2026-10-22): same feature, prompt, brief and tests;
# a different stand-in makes it a different task (ROADMAP: interview v2). Candidate for the v2 tiers.
user = "reticent"
ask_tool = "on"
reticence = "strict"
tool_answers = "full"
suites = ["interview-v2-candidates"]
# Decision-dense feature with a user in the loop (docs/task-catalog.md, thirteenth search S3). Upstream:
# pydantic/httpx2 PR #1071 (merged 2026-08-05 as 5d9eedc, after the model cutoff). The prompt describes the basic
# request (cap one SSE event's buffering via sse(max_event_size=...), SSEError when exceeded); user.md holds the
# rules: on by default at 1 MiB (the PR body wrongly says None; the code and docs say 1 MiB), None disables,
# UTF-8 bytes, all field lines count but comments don't, a pending partial line counts per chunk, the count
# resets per event, the error carries the request.
timeout_s = 2400
budget_usd = 5.0
max_turns = 60
# Monorepo (uv workspace): httpcore2 and httpx2 are installed editable; no git, so uv-dynamic-versioning falls
# back to 0.0.0 for both. chardet is pinned to the repo dev-group version: newer releases change the reported
# encoding case and fail two existing tests.
install = "uv pip install --python /opt/venv/bin/python -e src/httpcore2 -e src/httpx2 pytest anyio trio chardet==6.0.0.post1 cryptography flaky pytest-httpbin pytest-trio starlette trustme uvicorn websockets werkzeug"
# Hidden tests/httpx2/test_sse.py is the fix's version with hand edits (re-apply after `build-task --force`):
#  1. The `match=` message pins are dropped from the nine pytest.raises(httpx2.SSEError, match=...) in the new
#     test_max_event_size_* tests (eight "N byte limit" pins and one "byte limit" in
#     test_max_event_size_applies_by_default), so any SSEError passes (user.md still states the wording).
#  2. test_max_event_size_applies_by_default_async is removed: it reads the private attribute
#     `EventSource._max_event_size`. The default is still covered by the sync test_max_event_size_applies_by_default.
acceptance = ["tests/httpx2/test_sse.py"]
regression = "python -m pytest -q -p no:cacheprovider tests/httpx2/models tests/httpx2/test_exceptions.py tests/httpx2/test_config.py tests/httpx2/test_utils.py tests/httpx2/test_content.py"

