# Decision-dense feature with a user in the loop (docs/task-catalog.md, eleventh search H2). Upstream:
# ReactiveX/RxPY PR #711, opened 2024 as `combine_throttle`, renamed and given its final completion semantics
# in a 2026-10-16 follow-up and squash-merged that day as 92b8293 (after the model cutoff). The prompt
# describes the basic operator (latest pending value from each source, one tuple per round); user.md holds the
# second-order design: completion rules, an empty source, zero sources, futures, None values, the three entry
# points. The 2024 draft (pre-cutoff) had different completion behaviour, so recalling it does not help.
timeout_s = 2400
budget_usd = 5.0
max_turns = 60
install = "uv pip install --python /opt/venv/bin/python -e . pytest pytest-asyncio"
acceptance = ["tests/test_observable/test_ziplatest.py", "tests/test_observable/test_combination_fluent.py"]
regression = "python -m pytest -q -p no:cacheprovider tests/test_observable tests/test_core tests/test_subject"

