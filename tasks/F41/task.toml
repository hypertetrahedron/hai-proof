id = "F41"
kind = "feature"
level = 2
origin = "upstream-fix"
# F13 under the strict + full reticent stand-in (2026-10-22): same feature, prompt, brief and tests;
# a different stand-in makes it a different task (ROADMAP: interview v2). Candidate for the v2 tiers.
user = "reticent"
ask_tool = "on"
reticence = "strict"
tool_answers = "full"
suites = ["interview-v2-candidates", "interview-v2", "interview"]
cost_tier = "low"
report_order = 20
# Decision-dense feature with a user in the loop (docs/task-catalog.md, eleventh search H1). Upstream:
# tox-dev/platformdirs PR #585 "add place_*_file methods that create parents as 0700" (squash-merged
# 2026-09-26 as dfaeabf, after the model cutoff). The prompt asks for a way to get a file path in a user
# directory with its parents created, and leaves the design to a conversation; user.md holds it, including the
# second-order points (0o700 on every directory created, existing ones untouched, independent of ensure_exists,
# rejected names create nothing, unknown home raises without creating). The method names mirror Rust's `xdg`
# crate, so the naming may be guessable; the rest is not.
timeout_s = 2400
budget_usd = 5.0
max_turns = 60
# The checkout has no .git (build-task strips it), so hatch-vcs needs a pretend version (base is
# 4.11.15-9-g46843f1).
install = "SETUPTOOLS_SCM_PRETEND_VERSION=4.11.16.dev9 uv pip install --python /opt/venv/bin/python -e . pytest pytest-mock appdirs==1.4.4"
# Hand edit to the fix's tests/test_api.py (re-apply after `build-task --force`):
# test_place_file_rejects_name_without_a_file pinned the exact message "name must point to a file, got ''";
# it now requires only a ValueError whose message shows the name. In pilot 20261019-211548-cc5a all three
# informative-arm failures were this wording alone ("must name a file"), which tests guessing, not design.
acceptance = ["tests/test_api.py", "tests/test_unix.py"]
regression = "python -m pytest -q -p no:cacheprovider tests"

