origin = "upstream-fix"
# F38 under the strict + full reticent stand-in (2026-10-22): same feature, prompt, brief and tests;
# a different stand-in makes it a different task (ROADMAP: interview v2). Candidate for the v2 tiers.
user = "reticent"
ask_tool = "on"
reticence = "strict"
tool_answers = "full"
suites = ["interview-v2-candidates"]
cost_tier = "low"
# Decision-dense feature with a user in the loop (fifteenth search). Upstream: python-poetry/poetry-core PR #945
# "add Marker.apply(environment) to partially evaluate a marker" (merged 2026-06-06 as 60516b6, after the
# model cutoff). The prompt asks for a method that partially evaluates a marker against a known environment
# and keeps what cannot be decided, and leaves the odd cases to the conversation; user.md holds the decisions:
# the method is `apply(environment)` and returns a marker, not a bool; a single marker whose variable is in
# the environment becomes AnyMarker or EmptyMarker; a variable absent from the environment is kept (unlike
# `validate`, which treats it as satisfied); AnyMarker and EmptyMarker come back unchanged; an empty
# environment returns the marker itself; composites are simplified as usual (and-with-empty is empty,
# or-with-any is any, the residual of the undecided branch is kept, nested forms work); `extra` is evaluated
# against a collection of extras, so with an empty tuple `extra == 'a'` becomes Empty and `extra != 'a'`
# becomes Any; the compact forms (`extra != 'a' and extra != 'b'`, `extra == 'a' or extra == 'b'`) behave
# the same.
timeout_s = 2400
budget_usd = 5.0
max_turns = 60
install = "SETUPTOOLS_SCM_PRETEND_VERSION=2.4.0 uv pip install --python /opt/venv/bin/python -e . pytest pytest-mock virtualenv build setuptools tomli-w trove-classifiers"
# Hidden tests/version/test_markers.py is the fix's version trimmed by hand (re-apply after `build-task --force`):
#  1. Everything except the imports, the EMPTY constant and test_apply is removed, so grading is fast (the full
#     file takes about 30 s); test_apply is the PR's test unchanged.
# Install sets SETUPTOOLS_SCM_PRETEND_VERSION in case the build strips .git.
acceptance = ["tests/version/test_markers.py"]
# The regression list leaves out tests/version/test_markers.py: it holds the hidden tests, so including it would fail at the start state.
regression = "python -m pytest -q -p no:cacheprovider tests/version/test_requirements.py tests/test_core_version.py tests/version/pep440 tests/packages/test_dependency.py tests/packages/test_main.py"

