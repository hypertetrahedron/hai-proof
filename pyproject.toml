[project]
name = "hai-proof"
version = "0.1.0"
description = "A/B smoke test for Claude Code harness modifications"
readme = "DESIGN.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
hai-proof = "hai_proof.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
